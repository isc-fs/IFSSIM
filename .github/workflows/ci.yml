name: CI

# PR-gating build/test suite. Every job runs on a free GitHub-hosted
# runner so contributors don't need a self-hosted Mac/UE5 to land a
# PR. The full plugin cook (UE5 BuildCookRun) is gated separately in
# `plugin-cook.yml` and only fires on PRs that touch Plugins/** or
# Config/** — that's the path that genuinely needs UE5 installed.
#
# Triggers:
#   - pull_request to dev/main: gates merges
#   - push to dev/main: post-merge sanity (catches squash-introduced
#     accidents and gives main/dev a clean status badge)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel an in-flight run when the same PR gets a new push — saves
# minutes and keeps the queue moving.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Bridge — colcon build of the ifssim_bridge ROS 2 package.
  # Uses the official ROS Humble desktop image; same toolchain the
  # dv_pipeline_stack container uses, so a green build here means a
  # green build in production.
  # ---------------------------------------------------------------
  bridge-build:
    name: Bridge — colcon build
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bridge build doesn't need LFS-tracked binary assets; skip
          # the large .uasset / mesh fetch.
          lfs: false

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-humble-foxglove-bridge \
            ros-humble-rclcpp \
            ros-humble-rclpy \
            ros-humble-sensor-msgs \
            ros-humble-sensor-msgs-py \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-tf2-msgs \
            ros-humble-std-msgs \
            ros-humble-rosidl-default-generators
          rm -rf /var/lib/apt/lists/*

      - name: colcon build (ifssim_bridge + fs_msgs)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2
          colcon build \
            --packages-select fs_msgs ifssim_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

  # ---------------------------------------------------------------
  # Frontend — Mission Control React app.
  # Lint + typecheck + production build. Catches eslint regressions
  # (#326 cleanup pinned the tree clean — this keeps it that way).
  # ---------------------------------------------------------------
  frontend:
    name: Mission Control — frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mission_control/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/mission_control/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # We pinned the entire src/ tree lint-clean in #338; keep it
        # that way. New `any`s, unused vars, missing react-hooks deps
        # all fail the build.
        run: npx eslint src

      - name: Typecheck
        # `tsc --noEmit` against the project's tsconfig — catches the
        # `: any` defeats-typing class of regressions that #336
        # closed.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Mission Control backend — Python unit tests.
  # The integration tests under tools/mission_control/backend/.venv
  # need a running sim; skip those. The new tests/ directory is
  # pure-Python (validators + scoring) and runs offline.
  # ---------------------------------------------------------------
  backend:
    name: Mission Control — backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mission_control/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        # `requirements.txt` already lists pytest among the dev deps
        # (we add it in this PR). FastAPI / pydantic pulled in for
        # the cases where main.py imports leak into a test.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile every file)
        run: |
          python -m compileall -q . tests/

      - name: pytest (unit tests only)
        run: pytest tests/ -v

  # ---------------------------------------------------------------
  # Tracks — every CSV under Content/tracks/ parses cleanly.
  # Catches stale generator output (#365 cycle hit a 1-byte empty
  # `random_track.csv` that would have shipped a phantom track).
  # ---------------------------------------------------------------
  tracks:
    name: Tracks — CSV validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Track CSVs are tiny text files (~kB each); LFS not used.
          lfs: false

      - name: Validate
        run: python3 tools/validate_tracks.py

  # ---------------------------------------------------------------
  # Internal markdown link check — catches dead links inside the
  # repo's docs (relative paths, anchors). External URL checking is
  # OFF by default: GitHub-the-internet's flakiness would turn this
  # into a noisy red flag, and broken external links are mostly the
  # third-party site's problem rather than ours.
  #
  # Tool: lychee (Rust). `--offline` flag skips external URLs and
  # only verifies relative file paths + anchors, which is exactly
  # what we want.
  # ---------------------------------------------------------------
  links:
    name: Docs — markdown link checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Lychee (offline mode)
        uses: lycheeverse/lychee-action@v2
        with:
          # `--offline` skips external URLs (only checks relative
          # paths + section anchors). `--no-progress` keeps the
          # log clean. `--exclude-loopback` doesn't apply here
          # since we're offline anyway. Scan the README + every
          # `.md` under docs/ and CHANGELOG.
          args: >-
            --offline
            --no-progress
            --verbose
            ./readme.md
            ./CHANGELOG.md
            ./docs/**/*.md
          fail: true

  # ---------------------------------------------------------------
  # Sticky PR comment — aggregate the five gating jobs above into a
  # single status table that's edited in place on every push. Saves
  # reviewers the tab-switch to the Checks page; one always-current
  # comment shows the entire gate at a glance.
  #
  # Only runs on pull_request events (not on push to dev/main —
  # there's no PR to comment on). `if: always()` makes the job fire
  # even when one of the needed jobs failed, so a red gate still
  # gets a comment listing which job is the blocker.
  #
  # The status-glyph mapping is built in a bash step rather than
  # inline ${{ }} expressions because GitHub Actions' expression
  # language doesn't support nested ternaries reliably (and `+`
  # isn't a string-concat operator there). Cleanest separation: bash
  # builds the markdown, sticky-pull-request-comment posts it.
  #
  # Permissions: pull-requests:write is the minimum needed to post
  # and edit the comment.
  # ---------------------------------------------------------------
  ci-summary:
    name: CI summary
    needs: [bridge-build, frontend, backend, tracks, links]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build status table
        id: build
        env:
          BRIDGE_RESULT:    ${{ needs.bridge-build.result }}
          FRONTEND_RESULT:  ${{ needs.frontend.result }}
          BACKEND_RESULT:   ${{ needs.backend.result }}
          TRACKS_RESULT:    ${{ needs.tracks.result }}
          LINKS_RESULT:     ${{ needs.links.result }}
          HEAD_SHA:         ${{ github.event.pull_request.head.sha }}
          RUN_ID:           ${{ github.run_id }}
          SERVER_URL:       ${{ github.server_url }}
          REPO:             ${{ github.repository }}
          WORKFLOW:         ${{ github.workflow }}
          HEAD_REF:         ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Map a job-result word to a glyph + label. Bash makes the
          # nesting trivial; ${{ }} expressions don't.
          glyph() {
            case "$1" in
              success)   echo "✅ pass" ;;
              failure)   echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              skipped)   echo "⏭ skip" ;;
              *)         echo "⚠ $1" ;;
            esac
          }

          BRIDGE_GLYPH=$(glyph "$BRIDGE_RESULT")
          FRONTEND_GLYPH=$(glyph "$FRONTEND_RESULT")
          BACKEND_GLYPH=$(glyph "$BACKEND_RESULT")
          TRACKS_GLYPH=$(glyph "$TRACKS_RESULT")
          LINKS_GLYPH=$(glyph "$LINKS_RESULT")

          # GITHUB_OUTPUT multi-line value protocol: <key><<DELIM ... DELIM
          # See https://docs.github.com/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          {
            echo "message<<__SUMMARY_END__"
            echo "## CI status — last commit \`${HEAD_SHA:0:7}\`"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Bridge — colcon build | ${BRIDGE_GLYPH} |"
            echo "| Mission Control — frontend | ${FRONTEND_GLYPH} |"
            echo "| Mission Control — backend | ${BACKEND_GLYPH} |"
            echo "| Tracks — CSV validator | ${TRACKS_GLYPH} |"
            echo "| Docs — markdown link checker | ${LINKS_GLYPH} |"
            echo ""
            echo "<sub>Run [\`${RUN_ID}\`](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) · workflow \`${WORKFLOW}\` · branch \`${HEAD_REF}\`</sub>"
            echo "__SUMMARY_END__"
          } >> "$GITHUB_OUTPUT"

      - name: Sticky CI status comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # `header` keys the comment so subsequent runs edit the
          # same one rather than appending new comments.
          header: ci-status
          message: ${{ steps.build.outputs.message }}
