name: CI

# PR-gating build/test suite. Every job runs on a free GitHub-hosted
# runner so contributors don't need a self-hosted Mac/UE5 to land a
# PR. The full plugin cook (UE5 BuildCookRun) is gated separately in
# `plugin-cook.yml` and only fires on PRs that touch Plugins/** or
# Config/** — that's the path that genuinely needs UE5 installed.
#
# Triggers:
#   - pull_request to dev/dev-manual/main: gates merges
#   - push to dev/dev-manual/main: post-merge sanity (catches squash-
#     introduced accidents and gives each branch a clean status badge)
#
# dev-manual is included because it is a protected branch too. A required
# status check on a branch the workflow never runs for does not gate
# anything -- the PR simply waits forever for a check that will not start.

on:
  pull_request:
    branches: [dev, dev-manual, main]
  push:
    branches: [dev, dev-manual, main]

# Cancel an in-flight run when the same PR gets a new push — saves
# minutes and keeps the queue moving.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Bridge — colcon build of the ifssim_bridge ROS 2 package.
  # Uses the official ROS Humble desktop image; same toolchain the
  # dv_pipeline_stack container uses, so a green build here means a
  # green build in production.
  # ---------------------------------------------------------------
  bridge-build:
    name: Bridge — colcon build
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Bridge build doesn't need LFS-tracked binary assets; skip
          # the large .uasset / mesh fetch.
          lfs: false
          # fs_msgs now lives in the IFS08-DV-PIPELINE submodule at
          # pipeline/ (the autonomy pipeline was extracted to its own
          # repo). ifssim_bridge depends on fs_msgs's generated message
          # types, so the submodule must be checked out to build the
          # bridge. IFS08-DV-PIPELINE is public, so the default
          # GITHUB_TOKEN fetches it fine — no extra credentials needed.
          submodules: recursive

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-humble-foxglove-bridge \
            ros-humble-rclcpp \
            ros-humble-rclpy \
            ros-humble-sensor-msgs \
            ros-humble-sensor-msgs-py \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-tf2-msgs \
            ros-humble-std-msgs \
            ros-humble-rosidl-default-generators
          rm -rf /var/lib/apt/lists/*

      - name: colcon build (ifssim_bridge + fs_msgs)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          # fs_msgs is now under the pipeline submodule (pipeline/fs_msgs);
          # ifssim_bridge stays in ros2/src. Point colcon at both base
          # paths and let it topologically order fs_msgs before the bridge.
          colcon build \
            --packages-select fs_msgs ifssim_bridge \
            --base-paths ros2/src pipeline \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

  # ---------------------------------------------------------------
  # Frontend — Mission Control React app.
  # Lint + typecheck + production build. Catches eslint regressions
  # (#326 cleanup pinned the tree clean — this keeps it that way).
  # ---------------------------------------------------------------
  frontend:
    name: Mission Control — frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mission_control/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/mission_control/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # We pinned the entire src/ tree lint-clean in #338; keep it
        # that way. New `any`s, unused vars, missing react-hooks deps
        # all fail the build.
        run: npx eslint src

      - name: Typecheck
        # `tsc --noEmit` against the project's tsconfig — catches the
        # `: any` defeats-typing class of regressions that #336
        # closed.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Mission Control backend — Python unit tests.
  # The integration tests under tools/mission_control/backend/.venv
  # need a running sim; skip those. The new tests/ directory is
  # pure-Python (validators + scoring) and runs offline.
  # ---------------------------------------------------------------
  backend:
    name: Mission Control — backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mission_control/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        # `requirements.txt` already lists pytest among the dev deps
        # (we add it in this PR). FastAPI / pydantic pulled in for
        # the cases where main.py imports leak into a test.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile every file)
        run: |
          python -m compileall -q . tests/

      - name: pytest (unit tests only)
        run: pytest tests/ -v

  # ---------------------------------------------------------------
  # Tracks — every CSV under Content/tracks/ parses cleanly.
  # Catches stale generator output (#365 cycle hit a 1-byte empty
  # `random_track.csv` that would have shipped a phantom track).
  # ---------------------------------------------------------------
  tracks:
    name: Tracks — CSV validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Track CSVs are tiny text files (~kB each); LFS not used.
          lfs: false

      - name: Validate
        run: python3 tools/validate_tracks.py

  # ---------------------------------------------------------------
  # Internal markdown link check — catches dead links inside the
  # repo's docs (relative paths, anchors). External URL checking is
  # OFF by default: GitHub-the-internet's flakiness would turn this
  # into a noisy red flag, and broken external links are mostly the
  # third-party site's problem rather than ours.
  #
  # Tool: lychee (Rust). `--offline` flag skips external URLs and
  # only verifies relative file paths + anchors, which is exactly
  # what we want.
  # ---------------------------------------------------------------
  links:
    name: Docs — markdown link checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Lychee (offline mode)
        uses: lycheeverse/lychee-action@v2
        with:
          # `--offline` skips external URLs (only checks relative
          # paths + section anchors). `--no-progress` keeps the
          # log clean. `--exclude-loopback` doesn't apply here
          # since we're offline anyway. Scan the README + every
          # `.md` under docs/ and CHANGELOG.
          args: >-
            --offline
            --no-progress
            --verbose
            ./readme.md
            ./CHANGELOG.md
            ./docs/**/*.md
          fail: true

  # ---------------------------------------------------------------
  # Sticky PR comment — aggregate the five gating jobs above into a
  # single status table that's edited in place on every push. Saves
  # reviewers the tab-switch to the Checks page; one always-current
  # comment shows the entire gate at a glance.
  #
  # `if: always()` runs the job even when a gating job fails, so a
  # red gate still gets a comment listing which job is the blocker.
  # The job is gated to pull_request events via the workflow-level
  # trigger plus an event_name guard inside the github-script body —
  # on push events to dev/main there's no PR to comment on.
  #
  # Implementation: actions/github-script (official) finds the
  # existing comment by HTML-comment marker and PATCHes it, or
  # creates a new one if none exists. Self-contained — no
  # third-party action dependencies.
  # ---------------------------------------------------------------
  ci-summary:
    name: CI summary
    needs: [bridge-build, frontend, backend, tracks, links]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert sticky CI status comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BRIDGE_RESULT:   ${{ needs.bridge-build.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT:  ${{ needs.backend.result }}
          TRACKS_RESULT:   ${{ needs.tracks.result }}
          LINKS_RESULT:    ${{ needs.links.result }}
        with:
          script: |
            const MARKER = '<!-- ci-status-comment -->';
            const glyph = (r) => ({
              success:   '✅ pass',
              failure:   '❌ failure',
              cancelled: '🚫 cancelled',
              skipped:   '⏭ skip',
            }[r] || `⚠ ${r}`);

            const headSha = context.payload.pull_request.head.sha;
            const runUrl  = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch  = context.payload.pull_request.head.ref;

            const body = [
              MARKER,
              `## CI status — last commit \`${headSha.slice(0, 7)}\``,
              '',
              '| Job | Result |',
              '|---|---|',
              `| Bridge — colcon build | ${glyph(process.env.BRIDGE_RESULT)} |`,
              `| Mission Control — frontend | ${glyph(process.env.FRONTEND_RESULT)} |`,
              `| Mission Control — backend | ${glyph(process.env.BACKEND_RESULT)} |`,
              `| Tracks — CSV validator | ${glyph(process.env.TRACKS_RESULT)} |`,
              `| Docs — markdown link checker | ${glyph(process.env.LINKS_RESULT)} |`,
              '',
              `<sub>Run [\`${context.runId}\`](${runUrl}) · workflow \`${context.workflow}\` · branch \`${branch}\`</sub>`,
            ].join('\n');

            // Find an existing sticky comment by marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`updated sticky comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
              core.info('created sticky comment');
            }

      # THIS JOB MUST BE ABLE TO FAIL.
      #
      # Everything above only writes a comment, and the job carries
      # `if: always()`, so "CI summary" reported SUCCESS even when every
      # other job failed. As a required status check that is worse than
      # having none: the branch looks gated and is not.
      #
      # One required check that aggregates the rest is easier to maintain
      # than five that have to be renamed in the branch rules whenever a
      # job is renamed -- but only if it actually reflects them.
      - name: Fail if any CI job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more CI jobs did not pass:"
          echo "  bridge-build : ${{ needs.bridge-build.result }}"
          echo "  frontend     : ${{ needs.frontend.result }}"
          echo "  backend      : ${{ needs.backend.result }}"
          echo "  tracks       : ${{ needs.tracks.result }}"
          echo "  links        : ${{ needs.links.result }}"
          exit 1
