name: Package Mac Build

# Triggers on version tags (e.g. v1.0.0) pushed to main,
# or when a GitHub Release is manually created.
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [created]

jobs:
  package:
    # Requires a self-hosted runner on a Mac with UE5 installed.
    # Register one at: Settings → Actions → Runners → New self-hosted runner.
    # Set UE5_ROOT in the runner's env (e.g. /Users/Shared/Epic Games/UE_5.7).
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Resolve UE5 root
        id: ue5
        run: |
          # Respect env override, fall back to default Epic install location
          ROOT="${UE5_ROOT:-/Users/Shared/Epic Games/UE_5.7}"
          if [ ! -f "$ROOT/Engine/Build/BatchFiles/RunUAT.sh" ]; then
            echo "::error::UE5 not found at '$ROOT'. Set UE5_ROOT on the runner."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Package (BuildCookRun)
        run: |
          "${{ steps.ue5.outputs.root }}/Engine/Build/BatchFiles/RunUAT.sh" \
            BuildCookRun \
            -project="$GITHUB_WORKSPACE/IFSSIM.uproject" \
            -platform=Mac \
            -clientconfig=Shipping \
            -cook \
            -build \
            -stage \
            -pak \
            -noP4 \
            -utf8output

      # DO NOT PACKAGE Packaged/Mac. On Mac with Modern Xcode, BuildCookRun's
      # archive step copies the app from Binaries/Mac -- the bare link output,
      # with NO cooked content. It is ~220 MB, it builds and signs cleanly, and
      # it is useless: no .pak, no .ucas, nothing to load. The complete app is
      # the one the STAGE step assembles under Saved/StagedBuilds/Mac, at
      # ~1 GB. Windows does not have this split, which is why package-windows
      # can archive its output directly and this cannot.
      - name: Assemble the shippable app
        id: assemble
        run: |
          set -euo pipefail
          STAGED="$GITHUB_WORKSPACE/Saved/StagedBuilds/Mac/IFSSIM-Mac-Shipping.app"
          OUT="$GITHUB_WORKSPACE/dist"
          APP="$OUT/IFSSIM.app"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # Fail loudly rather than shipping a contentless bundle.
          test -d "$STAGED/Contents/UE/IFSSIM/Content/Paks" \
            || { echo "::error::staged app has no Paks -- cook/stage did not complete"; exit 1; }

          # ditto, not cp -r: preserves symlinks, resource forks and xattrs. cp
          # can flatten a framework symlink into a bundle that runs on the
          # build machine and nowhere else.
          ditto "$STAGED" "$APP"

          # settings.json at ProjectDir and tracks at ProjectDir/Content/tracks
          # are the first candidate each loader checks (FSDSSettings.cpp,
          # FSDSConeSpawner.cpp). Inside the bundle they resolve however the
          # app is launched; a double-clicked .app has an unreliable LaunchDir.
          PROJ="$APP/Contents/UE/IFSSIM"
          cp "$GITHUB_WORKSPACE/settings.json" "$PROJ/settings.json"
          mkdir -p "$PROJ/Content/tracks"
          cp "$GITHUB_WORKSPACE/Content/tracks/"*.csv "$PROJ/Content/tracks/"

          # Editing the bundle invalidates its seal; re-sign ad-hoc or
          # Gatekeeper refuses to launch it.
          codesign --force --deep --sign - "$APP"
          codesign -v "$APP"

          VERSION="${{ github.ref_name }}"
          ZIPNAME="IFSSIM-${VERSION}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/$ZIPNAME"
          echo "name=$ZIPNAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$GITHUB_WORKSPACE/$ZIPNAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Report artifact
        run: |
          echo "### macOS artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.assemble.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256 \`${{ steps.assemble.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Creates the release if triggered by a tag push;
          # attaches to the existing release if triggered by release creation.
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.assemble.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
