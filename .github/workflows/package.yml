name: Package builds

# Builds the sim on the machines that offered to, and adds each OS's zip to
# the GitHub Release the sim's updater reads, with tools/publish_build.sh:
# the same script a person runs by hand (docs/TEAM_SETUP.md, "Publishing a
# build"). A v* tag publishes Stable; a merge to dev publishes Latest.
#
# Each OS waits for a runner registered with only its label
# (--no-default-labels --labels ifssim-package-<os>). An OS with no runner
# online just waits, and anyone can publish it by hand meanwhile; a newer
# run replaces a waiting one.

on:
  push:
    tags: ['v*.*.*']
    branches: [dev]
  workflow_dispatch:
    inputs:
      channel:
        description: stable (the release of ProjectVersion) or latest (latest-dev)
        type: choice
        options: [latest, stable]
        default: latest

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, mac, linux]
    runs-on: "ifssim-package-${{ matrix.os }}"
    concurrency:
      group: package-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/') && 'stable' || 'latest') }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
      - name: Build and publish
        shell: bash   # Git Bash on Windows
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          tools/publish_build.sh "$CHANNEL"
