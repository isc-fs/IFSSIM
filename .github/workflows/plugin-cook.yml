name: Plugin cook (UE5)

# Cooks the project on a self-hosted Mac runner with UE5 5.7
# installed. Heavy (~2 min on a fresh runner, longer with cold
# DerivedDataCache) so it's gated on path filters: only PRs that
# actually touch UE5-side code (Plugins/, Config/, Content/, the
# .uproject, or the package script) trigger this. PRs that only
# touch the bridge / Mission Control / docs skip it entirely.
#
# This is a SEPARATE workflow from `ci.yml` so the GitHub-hosted
# jobs there always run (they're free, fast, and never need a
# self-hosted runner). This workflow only runs when it has to,
# and only on the runner that can actually do the work.
#
# Distinct from `package-mac.yml`, which only fires on tag pushes
# to produce a Release artefact. This is the PR gate; that's the
# release pipeline.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'Plugins/**'
      - 'Config/**'
      - 'Content/**'
      - 'IFSSIM.uproject'
      - 'package_mac.sh'
      - '.github/workflows/plugin-cook.yml'
  push:
    branches: [dev, main]
    paths:
      - 'Plugins/**'
      - 'Config/**'
      - 'Content/**'
      - 'IFSSIM.uproject'
      - 'package_mac.sh'

concurrency:
  group: plugin-cook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cook:
    name: BuildCookRun (Shipping, Mac)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    # Non-blocking until the self-hosted runner is registered. Without
    # `continue-on-error: true`, every PR that touches the UE5 side
    # would be stuck "cancelled" because GitHub gives up after ~2 min
    # with no runner listening. The 4 GitHub-hosted CI jobs in
    # `ci.yml` are the actual merge gate; this is a "we tried to cook
    # — see results when a runner exists" signal.
    #
    # To register the runner: Settings → Actions → Runners → New
    # self-hosted runner. Set UE5_ROOT in the runner's env (e.g.
    # /Users/Shared/Epic Games/UE_5.7). Same setup the existing
    # `package-mac.yml` already needs for tag-push releases.
    #
    # Once a runner is online, removing `continue-on-error` here makes
    # plugin-cook a hard gate alongside the GitHub-hosted jobs.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Plugin cook needs LFS-tracked binary content (cone meshes,
          # vehicle textures, the new M_LiDARStencilEncoder.uasset).
          lfs: true

      - name: Resolve UE5 root
        id: ue5
        run: |
          ROOT="${UE5_ROOT:-/Users/Shared/Epic Games/UE_5.7}"
          if [ ! -f "$ROOT/Engine/Build/BatchFiles/RunUAT.sh" ]; then
            echo "::error::UE5 not found at '$ROOT'. Set UE5_ROOT on the runner."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Cook (no-archive PR gate)
        # Same flags as `package_mac.sh` step 1, minus -archive — we
        # don't need the staged .app on disk, just the cook + build.
        # If this exits clean, the package-mac release workflow that
        # runs on tag push will succeed too.
        run: |
          "${{ steps.ue5.outputs.root }}/Engine/Build/BatchFiles/RunUAT.sh" \
            BuildCookRun \
            -project="$GITHUB_WORKSPACE/IFSSIM.uproject" \
            -platform=Mac \
            -configuration=Shipping \
            -build -cook -stage -pak \
            -iostore -compressed \
            -clientconfig=Shipping \
            -noeditor \
            -utf8output

      - name: Surface critical material warnings
        if: always()
        run: |
          # The cook log is verbose. Surface anything that looks like a
          # genuine compilation failure on the LiDAR-related shaders or
          # M_LiDARStencilEncoder. Exit non-zero on any new "Failed to
          # compile" line that isn't on the documented Technion-car
          # SuvCar-fallback materials (those are expected to fail per
          # DefaultEngine.ini's CoreRedirects comment).
          UE_LOG="$HOME/Library/Logs/Unreal Engine/LocalBuildLogs"
          LATEST_LOG=$(ls -t "$UE_LOG"/*.log 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_LOG" ]; then
            grep -iE "FSDSLidar|StencilEncoder|: error:|Failed to compile.*FSDSPlugin" \
              "$LATEST_LOG" | tail -50 || true
          fi
