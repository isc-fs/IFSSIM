name: Publish pipeline image

# CD for the simulator stack. Building dv_pipeline_stack locally compiles the
# ROS workspace and installs gtsam / numba / the FaSTTUBe planner — minutes of
# work and a full toolchain — which every team member currently pays on first
# run and after any Dockerfile change. Publishing the image means a new member
# can `docker compose pull` and be running the sim without building anything.
#
# Consume it with the pull override:
#   docker compose -f docker-compose.yml -f docker-compose.pull.yml up -d
on:
  push:
    branches: [dev, main]
    # Only rebuild when something that lands IN the image changes.
    paths:
      - 'docker/dv_pipeline_stack/**'
      - 'ros2/src/**'
      - 'pipeline'
      - '.github/workflows/publish-pipeline-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/ifssim-dv_pipeline_stack

jobs:
  # Each architecture builds natively on its own runner and pushes by digest;
  # `merge` then publishes one multi-arch tag. arm64 used to build under QEMU
  # on the amd64 runner, and its colcon step failed there (dv_msgs could not
  # find builtin_interfaces' libraries) while the same Dockerfile builds fine
  # on real arm64 hardware, so nothing was published from late September on.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          # arm64 matters: the team develops on Apple Silicon, and an
          # amd64-only image would run the whole pipeline under emulation.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          # The Dockerfile does `COPY pipeline/ src/` — without the submodule
          # the image builds an autonomy stack with no autonomy in it.
          submodules: recursive

      - name: Fail fast if the submodule is empty
        run: |
          test -f pipeline/package.xml -o -d pipeline/control \
            || { echo "::error::pipeline submodule not checked out"; exit 1; }
          echo "submodule pin: $(git -C pipeline rev-parse --short HEAD)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dv_pipeline_stack/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # dev pushes publish :dev and :sha-<short>; main also gets :latest,
          # so `latest` always means "what main runs", never a dev snapshot.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Check both architectures are in it
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)' >/dev/null \
            || { echo "::error::$ref is missing an architecture"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull it:"
            echo '```bash'
            echo "docker compose -f docker-compose.yml -f docker-compose.pull.yml pull"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
