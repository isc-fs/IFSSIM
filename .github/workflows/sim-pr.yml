name: Sim PR check
run-name: >-
  ${{ inputs.pipeline_pr && format('Sim check: pipeline PR #{0}', inputs.pipeline_pr)
      || github.event.pull_request.title || github.event.head_commit.message || 'Sim PR check' }}

# Drives the sim on the GPU box: a headless start-up check, the car
# characterisation (tools/characterise: scripted manoeuvres, no pipeline,
# checked against settings.json), then the missions
# in tools/ci/sim_check.json through this PR's pipeline, scored by the referee
# (now acceleration 3 times, which decides the check, then acceleration once on
# the Montmeló straight world, skidpad and one
# autocross track, reported only until they're reliable). The result, compared with the last dev run
# and with a map of each mission, goes to a comment on the PR and a row in the
# `sim-report` issue (tools/ci/sim_publish.py).
#
# The sim is only packaged (Linux, Development, so it keeps its logs) when its
# build inputs changed; tools/ci/sim_build.sh decides. A PR that only touches
# the pipeline, ROS or tools reuses the box's last build of dev and takes
# ~15 min. Pushes to dev that change the sim package it and publish that build
# for the PRs. A first build from scratch is ~1–1.5 h; later ones are incremental.
#
# The runner is a machine on a private network and this repo is public, so
# PRs only run for branches of this repo (never forks), and only after a
# maintainer adds the `sim-test` label. New pushes to a labelled PR run it
# again; remove the label to stop that. One sim run at a time on the box: the
# script waits for the box's sim-session lock (tools/ci/sim_pr_check.sh).
#
# Pipeline PRs: isc-fs/IFS09-DV-PIPELINE's sim-check.yml starts this workflow
# on dev with `pipeline_sha` (the PR's head) and `pipeline_pr`. The check then
# drives that pipeline commit instead of the pinned one, and posts its result
# on that commit as the `sim check` status, and the report as a comment on
# that PR. Both need the SIM_CHECK_TOKEN secret (Commit statuses and Pull
# requests: write on the pipeline repo); without it the run still happens.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [dev]
    paths:
      - "Source/**"
      - "Plugins/**"
      - "Config/**"
      - "Content/**"
      - "IFSSIM.uproject"
      - "settings.json"
      - "pipeline"
      - "ros2/**"
      - "docker/**"
      - "docker-compose.yml"
      - "tools/headless_run/**"
      - "tools/characterise/**"
      - "tools/sim_benchmark/**"
      - "tools/ci/**"
      - ".github/workflows/sim-pr.yml"
  push:
    branches: [dev]
    paths:
      - "Source/**"
      - "Plugins/**"
      - "Config/**"
      - "Content/**"
      - "!Content/tracks/**"
      - "IFSSIM.uproject"
      # Anything that changes how the car drives, too: these runs are the dev
      # result the PR checks compare with.
      - "settings.json"
      - "pipeline"
      - "ros2/**"
      - "docker/**"
      - "tools/headless_run/**"
      - "tools/characterise/**"
      - "tools/sim_benchmark/**"
      - "tools/ci/**"
      - ".github/workflows/sim-pr.yml"
  workflow_dispatch:
    inputs:
      repeats:
        description: "acceleration runs (empty: tools/ci/sim_check.json's)"
        default: ""
      package:
        description: "package the sim even if the shared dev build would do"
        type: boolean
        default: false
      pipeline_sha:
        description: "IFS09-DV-PIPELINE commit to drive instead of the pinned one (full SHA)"
        default: ""
      pipeline_pr:
        description: "IFS09-DV-PIPELINE PR number it comes from"
        default: ""
      random_seeds:
        description: "seeds of the random autocross tracks to drive (comma-separated, e.g. a failing one from the sim-report issue; empty: new ones)"
        default: ""

# contents: the track maps go to the ci-assets branch; issues and pull-requests:
# the PR comment and the sim-report issue (tools/ci/sim_publish.py).
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: >-
    sim-pr-${{ github.event.pull_request.number
      || (inputs.pipeline_pr && format('pipeline-{0}', inputs.pipeline_pr))
      || github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'sim-test') &&
       (github.event.action != 'labeled' || github.event.label.name == 'sim-test'))
    runs-on: [self-hosted, Linux, X64, gpu-1080]
    timeout-minutes: 300
    env:
      # CI's own copy of the box's engine, owned by the runner's user: a build
      # writes into the engine tree, and the box's own engine stays read-only.
      UE5_ROOT: /build/ifssim-ci/UE_5.8
      STAGE: ${{ github.workspace }}/Saved/StagedBuildsCI
      COMPOSE_PROJECT_NAME: ifssim-ci
      DV_IMAGE: ifssim-ci-dv_pipeline_stack:latest
      # Shader cache kept outside the engine copy, so re-copying the engine keeps it.
      UE-LocalDataCachePath: /build/ifssim-ci/ddc
      PIPELINE_SHA: ${{ inputs.pipeline_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          # LFS after checkout (next step): the runner's repo is a partial clone
          # (blob:none), and checkout's own LFS fetch scans the ref before its
          # pointer files are downloaded, so it fails on any new LFS file.
          lfs: false
          submodules: true
          # Keep Intermediate/ and Saved/ from the last job: incremental build and cook.
          clean: false

      - name: Fetch LFS files
        run: git lfs pull

      - name: Mark the pipeline commit as pending
        if: inputs.pipeline_sha
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.SIM_CHECK_TOKEN }}
        run: tools/ci/pipeline_status.sh pending "running on the GPU box"

      - name: Use the pipeline commit under test
        if: inputs.pipeline_sha
        run: |
          [[ "$PIPELINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::pipeline_sha must be a full 40-character commit SHA"; exit 1; }
          git -C pipeline fetch -q --no-tags --depth=1 origin "$PIPELINE_SHA"
          git -C pipeline checkout -q --detach "$PIPELINE_SHA"
          echo "pipeline: $(git -C pipeline log -1 --oneline)"

      - name: Pick or package the sim
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          FORCE_PACKAGE: ${{ inputs.package || false }}
        run: tools/ci/sim_build.sh

      # The stack is built under its own tag: docker-compose.yml pins its image name to
      # ifssim-dv_pipeline_stack:latest, and building that would replace the box's own.
      - name: Build the pipeline images
        run: |
          docker build -f docker/dv_pipeline_stack/Dockerfile -t "$DV_IMAGE" .
          docker compose build mission_control_backend

      - name: Drive the sim
        env:
          IFSSIM_DV_IMAGE: ${{ env.DV_IMAGE }}
          REPEATS: ${{ inputs.repeats }}
          RANDOM_SEEDS: ${{ inputs.random_seeds }}
          RESULTS: ${{ runner.temp }}/sim-pr-results
          REPORT: ${{ runner.temp }}/sim-pr-results/report
          BASELINE: /build/ifssim-ci/baseline/report.json
        run: tools/ci/sim_pr_check.sh

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-pr-results
          path: ${{ runner.temp }}/sim-pr-results
          retention-days: 14
          if-no-files-found: ignore

      # The PR comment (this repo's PR or the pipeline PR), the sim-report issue,
      # and on dev the result later PRs compare with.
      - name: Publish the report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ inputs.pipeline_pr && secrets.SIM_CHECK_TOKEN || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PIPELINE_PR: ${{ inputs.pipeline_pr }}
          REPORT: ${{ runner.temp }}/sim-pr-results/report
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$REPORT/report.json" ] || { echo "no report: nothing to publish"; exit 0; }
          args=(--report-dir "$REPORT" --run-url "$RUN_URL"
                --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                --baseline /build/ifssim-ci/baseline/report.json)
          if [[ "$PIPELINE_PR" =~ ^[0-9]+$ ]]; then
            args+=(--pr-repo isc-fs/IFS09-DV-PIPELINE --pr "$PIPELINE_PR"
                   --source "[pipeline #$PIPELINE_PR](https://github.com/isc-fs/IFS09-DV-PIPELINE/pull/$PIPELINE_PR)")
          elif [ -n "$PR_NUMBER" ]; then
            args+=(--pr-repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --source "#$PR_NUMBER")
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            args+=(--source "dev push" --save-baseline /build/ifssim-ci/baseline)
          else
            args+=(--source "manual, $GITHUB_REF_NAME")
          fi
          python3 tools/ci/sim_publish.py "${args[@]}"

      - name: Post the result on the pipeline commit
        if: always() && inputs.pipeline_sha
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.SIM_CHECK_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) tools/ci/pipeline_status.sh success "every required mission finished" ;;
            failure) tools/ci/pipeline_status.sh failure "a run didn't finish or the sim failed; see the run" ;;
            *)       tools/ci/pipeline_status.sh error "the run was $RESULT" ;;
          esac
