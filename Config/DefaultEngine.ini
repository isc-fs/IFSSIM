; ---- Asset CoreRedirects: remap old /AirSim/ package paths to /Game/Vehicle/ ----
; These assets were moved from FSDSPlugin (mount point /AirSim/) to main Content.
; Only redirects where the object name is the SAME in source and target use PackageRedirects.
; Redirects to different-named objects use ObjectRedirects (obj.name preserved otherwise).
; Materials referencing deleted SuvCar assets are intentionally NOT redirected here —
; they will fail to load gracefully (Display warning), and C++ falls back to mat_british_green.
[CoreRedirects]
; === Mesh, skeleton, physics — same object name in both packages (safe PackageRedirects) ===
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/FormulaMesh",NewName="/Game/Vehicle/TechnionCar/FormulaMesh")
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/FormulaMesh_Skeleton",NewName="/Game/Vehicle/TechnionCar/FormulaMesh_Skeleton")
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/FormulaMesh_PhysicsAsset",NewName="/Game/Vehicle/TechnionCar/FormulaMesh_PhysicsAsset")
; === Physics animation (different object name — use ObjectRedirects) ===
+ObjectRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/RacingTechnion_Pa.RacingTechnion_Pa",NewName="/Game/Vehicle/TechnionCar/FormulaMesh_PhysicsAsset.FormulaMesh_PhysicsAsset")
; === Tire rubber → chassis material (different object name — use ObjectRedirects) ===
+ObjectRedirects=(OldName="/AirSim/VehicleAdv/Cars/SuvCar/AutomotiveMaterials/Materials/Rubber/M_TireRubber.M_TireRubber",NewName="/Game/Vehicle/TechnionCar/Materials/mat_chassis_Formula.mat_chassis_Formula")
; === Texture and materials that only reference carbonFiber_Formula_texture (fixable) ===
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/matreials_and_textures/carbonFiber_Formula_texture",NewName="/Game/Vehicle/TechnionCar/Materials/carbonFiber_Formula_texture")
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/matreials_and_textures/mat_carbonFiber_Formula",NewName="/Game/Vehicle/TechnionCar/Materials/mat_carbonFiber_Formula")
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/matreials_and_textures/mat_chassis_Formula",NewName="/Game/Vehicle/TechnionCar/Materials/mat_chassis_Formula")
+PackageRedirects=(OldName="/AirSim/VehicleAdv/Cars/TechnionCar/matreials_and_textures/mat_british_green",NewName="/Game/Vehicle/TechnionCar/Materials/mat_british_green")
; === NOT redirected (reference deleted SuvCar assets — let them fail as Display warnings) ===
; m_red_real_formula_mat, mat_dashboard_Formula, mat_junts_Formula, mat_yellow_Formula, nose_red_mat
; → LoadObject() returns null → C++ FSDSVehiclePawn falls back to mat_british_green

