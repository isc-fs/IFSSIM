; ---- Simulator rendering: disable GPU-heavy UE5 features not needed for sim ----

[SystemSettings]
; ---- Frame-rate cap ----------------------------------------------------
; Hard-cap at 60 Hz. Without this, on capable hardware the renderer can
; free-run at 100+ FPS — pure waste for a sim where physics & sensors are
; the only things that matter. 60 Hz also matches the UE5 default tick
; quantum (1/60 s) so VSync-aligned displays stop juddering.
t.MaxFPS=60
; ---- CustomDepth + Stencil --------------------------------------------
; Cone spawn code (#321 D-Phase-1) tags each cone mesh with a
; CustomDepthStencilValue (1=blue, 2=yellow, 3=big-orange,
; 4=small-orange) so a future LiDAR post-process pass can sample
; SceneTexture:CustomStencil and apply per-material 905 nm reflectance
; from a uniform LUT. r.CustomDepth=3 enables the depth+stencil pass;
; default 1 is depth-only and silently discards the stencil writes.
;
; Cost: one additional pass over CustomDepth-tagged meshes per scene
; capture / main view. Negligible at our cone counts (~50–200 per
; scene) since they're small static meshes. Phase 2 (the actual LUT
; lookup) lands once the post-process material asset is authored.
r.CustomDepth=3
; ---- Resolution scale --------------------------------------------------
; Render the PIE viewport at 25 % of native resolution and upscale.
; The sim is GPU-bound at full resolution (24 ms/frame, hard 42 FPS cap)
; while the game thread itself is light (~5 ms). At 25 % the GPU drops
; under the frame-budget threshold and the editor stops being the
; bottleneck — physics, LiDAR ray-traces, and the autonomy stack all
; run identically (none of them touch the rendered framebuffer). Bump
; this to 100 only when actually inspecting visuals.
r.ScreenPercentage=25
; Lumen GI → None (use baked indirect lighting / sky light instead)
r.DynamicGlobalIlluminationMethod=0
; Lumen reflections → Reflection Captures (rebuild once in editor)
r.ReflectionMethod=0
; Virtual Shadow Maps → Cascaded Shadow Maps (much lower GPU cost)
r.Shadow.Virtual.Enable=0
; Screen-space reflections off (captures handle this)
r.ScreenSpaceReflections=0
; Motion blur off (irrelevant for sim, costs GPU)
r.MotionBlurQuality=0
; Bloom off — already minimal at quality 1, but the bloom pass still
; runs each frame. Setting to 0 short-circuits the whole pass. Visual
; loss: bright sky/cone edges no longer get a soft halo; readable.
r.BloomQuality=0
; Lens flare off
r.LensFlareIntensity=0
; Depth of field off
r.DepthOfFieldQuality=0
; SSAO fully off — was 1 level + radius 0.5; the AO pass is still
; relatively expensive on integrated GPUs even at low quality.
; Visual loss: cone bases / car shadow contact get slightly less
; defined; near-imperceptible at 25% screen-percentage.
r.AmbientOcclusionLevels=0
; AA method: leave as UE5 default (TSR). Tried r.AntiAliasingMethod=1
; (FXAA) for the supposed "FXAA is cheaper at low resolutions" theory
; — verified empirically on 2026-05-15 that the combination of FXAA +
; r.ScreenPercentage=25 produces savage ground/horizon aliasing
; because there's not enough source pixels for the screen-space
; filter to clean up, and unlike TSR there's no temporal info to fall
; back on. Cooked screenshot showed heavy stipple on the asphalt and
; a jagged sky/ground horizon line. Reverted; the 5-10 ms GPU "saving"
; isn't worth the visual collapse.
; Shadow quality reduced (2 = medium, was 5 with VSM)
r.ShadowQuality=2
; Disable contact shadows (expensive)
r.ContactShadows=0
; Eye adaptation (auto-exposure) off — sim has fixed lighting conditions
r.EyeAdaptationQuality=0

; ---- Memory reduction ----
; Cap texture streaming pool — default is auto-sized to GPU VRAM (can be 2-4 GB).
; 512 MB is plenty for a low-fidelity sim environment.
r.Streaming.PoolSize=512
; Limit temp memory used while uploading textures to GPU
r.Streaming.MaxTempMemoryAllowed=50
; Reduce max shadow map atlas size — was 1024, now 512. Halves the
; shadow pass cost. Visual loss: dynamic-light shadows on car edges
; get slightly pixelated; not visible at 25% screen-percentage.
r.Shadow.MaxResolution=512
r.Shadow.TransitionScale=0.5
; Disable nanite (requires large in-memory mesh data; irrelevant for sim)
r.Nanite.MaxPixelsPerEdge=100
; Force static meshes (track environment, cones, asphalt) to render at
; LOD1 instead of LOD0. Vehicle is a skeletal mesh, unaffected. LOD1
; has ~50–70% the polygon count of LOD0 for typical assets — real
; render saving on a scene with ~100+ cones in view simultaneously.
; Visual loss: cone silhouettes very slightly less round at <10 m
; range; imperceptible at 25% screen-percentage. Reading material
; intensity from CustomDepth/stencil (the LiDAR encoder LUT path) is
; not affected — that's a per-pixel pass on the depth buffer, not
; the mesh LOD.
r.StaticMeshLODBias=1
; Reduce render target pool size (holds intermediate render passes in VRAM/RAM)
r.RenderTargetPoolMin=100
; Limit number of pre-cached shader permutations kept in RAM
r.ShaderPipelineCache.Enabled=0
; Force GC more aggressively
gc.TimeBetweenPurgingPendingKillObjects=10
; Reduce async loading thread memory
s.AsyncLoadingThreadEnabled=1
s.EventDrivenLoaderEnabled=1
s.AsyncLoadingUseFullTimeLimit=0

; ---- Scalability groups — force low quality for sim use ----
; These are resolved against DefaultScalability.ini quality level definitions
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=0
sg.ShadowQuality=1
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0

; ---- Physics thread budget ----
; Chaos physics defaults to many worker threads — cap for a single-car sim
p.Chaos.Substep.MaxSubsteps=4
p.Chaos.Solver.Iterations.Position=4

; ---- Misc CPU/memory savers ----
; Disable volumetric fog (expensive, irrelevant for an open track)
r.VolumetricFog=0
; Disable translucency lighting volume (not needed without Lumen)
r.TranslucencyLightingVolume.Dim=1
; GPU particle spawning off (no complex VFX in this sim)
fx.Niagara.MaxGPUParticlesSpawnPerFrame=0
; Reduce foliage draw distance (cones/track don't use foliage, but editor assets may)
foliage.LODDistanceScale=0.25
r.FoliageShadows=0

