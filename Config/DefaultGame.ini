[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=IFS Formula Student Driverless Simulator
Description=UE5.7-native driverless racing simulator

[/Script/UnrealEd.ProjectPackagingSettings]
+AdditionalNonUFSFiles=(Path="settings.json")
; Track CSV files: staged next to the binary (LaunchDir) as NonUFS files.
; FSDSConeSpawner searches LaunchDir/Content/tracks/ at runtime in packaged builds.
+AdditionalNonUFSFiles=(Path="Content/tracks/random_track.csv")
+AdditionalNonUFSFiles=(Path="Content/tracks/acceleration.csv")
+AdditionalNonUFSFiles=(Path="Content/tracks/skidpad.csv")
; Force-cook vehicle assets — materials are loaded at runtime via LoadObject()
; so the dependency tracker won't discover them automatically
+DirectoriesToAlwaysCook=(Path="/Game/Vehicle")
; Force-cook cone assets — BPs/meshes are loaded at runtime via LoadObject()
; Scope to trafficones_scaled only; /Game/RaceCourse/Model/Splines/ has broken BPs
+DirectoriesToAlwaysCook=(Path="/Game/RaceCourse/Model/Environment/trafficones_scaled")
