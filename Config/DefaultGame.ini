[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=IFS Formula Student Driverless Simulator
Description=UE5.7-native driverless racing simulator
; Single source of truth for the build version. UE5 stamps this into
; the cooked .exe / .app resources (visible via `Get-Item .exe |
; Format-List VersionInfo` on Windows, `mdls` on Mac). The packaging
; scripts (package_mac.sh, package_windows.sh) read this same value
; to name the distribution archive (IFSSIM-v<X.Y.Z>-...). Bump in
; this file alone — both sides pick it up.
ProjectVersion=0.1.1

[/Script/UnrealEd.ProjectPackagingSettings]
+AdditionalNonUFSFiles=(Path="settings.json")
; Note: CSV track files are NOT staged via AdditionalNonUFSFiles (UE5.7 doesn't
; honour that for plain text files on Mac).  Instead they live in a tracks/ folder
; NEXT TO the .app in the distribution archive (Saved/StagedBuilds/Mac/tracks/).
; FSDSConeSpawner and the loadTrack RPC search that sibling directory at runtime.
; Force-cook vehicle assets — materials are loaded at runtime via LoadObject()
; so the dependency tracker won't discover them automatically
+DirectoriesToAlwaysCook=(Path="/Game/Vehicle")
; Force-cook cone assets — BPs/meshes are loaded at runtime via LoadObject()
; Scope to trafficones_scaled only; /Game/RaceCourse/Model/Splines/ has broken BPs
+DirectoriesToAlwaysCook=(Path="/Game/RaceCourse/Model/Environment/trafficones_scaled")
; Force-cook FSDSPlugin's runtime-loaded materials. M_LiDARStencilEncoder is
; loaded via LoadObject<UMaterialInterface>(/FSDSPlugin/Materials/...) inside
; FSDSLidarSensor::InitializeGPUPath — string-based, so the cook scanner
; never sees the dependency. Without this entry the .uasset gets stripped
; from the cooked package and the LUT path silently falls back to Rec.709
; luminance. Verified empirically: max-intensity stayed at 0.834
; (luminance baseline) on a cook without this directive, exactly because
; LoadObject returned nullptr at runtime.
+DirectoriesToAlwaysCook=(Path="/FSDSPlugin/Materials")
