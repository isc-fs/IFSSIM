; Default GameUserSettings — seeds the persistent
; %LOCALAPPDATA%\IFSSIM\Saved\Config\Windows\GameUserSettings.ini
; on first launch of a packaged build.
;
; Why this file lives separately from the [/Script/Engine.GameUserSettings]
; block in DefaultEngine.ini: UE5 reads window/resolution defaults from
; *this* file at engine init when no persistent GameUserSettings.ini
; exists yet. The DefaultEngine.ini block is merged later and does not
; reliably influence the first-launch window mode in Win64 Shipping —
; that's why -windowed alone on UECommandLine.txt kept losing to the
; default WindowedFullscreen path.
;
; FullscreenMode enum:
;     0 = Fullscreen (exclusive)
;     1 = WindowedFullscreen (borderless, desktop res — looks fullscreen)
;     2 = Windowed (chrome-bordered window at the chosen ResX/ResY)
;
; We want 2 so the sim leaves screen real estate for Mission Control,
; Lichtblick, and a terminal during dev. Packaging the sim for a demo
; is welcome to set FullscreenMode=1 via env override in
; package_windows.sh (TBD knob; not implemented yet).

[/Script/Engine.GameUserSettings]
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
DesiredScreenWidth=1280
DesiredScreenHeight=720
bUseDesktopResolutionForFullscreen=False
bUseDynamicResolution=False
Version=5
