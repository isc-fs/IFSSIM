; ---- IFSSIM Scalability Settings ----
; Defines what each sg.* quality level (0/1) maps to.
; Active levels are set in DefaultEngine.ini [SystemSettings] via sg.* variables.
; For this sim: most groups at 0 (minimum), shadows at 1 (low but visible).

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.4
r.SkeletalMeshLODBias=3

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.6
r.SkeletalMeshLODBias=1

[AntiAliasingQuality@0]
r.PostProcessAAQuality=0
r.TemporalAASamples=1
r.FXAA.Quality=0

[AntiAliasingQuality@1]
r.PostProcessAAQuality=2
r.TemporalAASamples=4

[ShadowQuality@0]
r.LightFunctionQuality=0
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.1

[ShadowQuality@1]
r.LightFunctionQuality=1
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.05

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.SceneColorFringeQuality=0
r.TonemapperFilm=0

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=1
r.AmbientOcclusionRadiusScale=0.5

[TextureQuality@0]
r.Streaming.MipBias=2
r.MaxAnisotropy=2
r.Streaming.PoolSize=256

[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
r.Streaming.PoolSize=512

[EffectsQuality@0]
r.TranslucencyLightingVolumeDim=1
r.RefractionQuality=0
r.SSR.Quality=0
r.SceneColorFormat=3
fx.Niagara.MaxGPUParticlesSpawnPerFrame=0

[EffectsQuality@1]
r.TranslucencyLightingVolumeDim=4
r.RefractionQuality=1
r.SSR.Quality=1

[FoliageQuality@0]
foliage.MinimumScreenSize=0.02
foliage.LODDistanceScale=0.25
r.FoliageShadows=0

[FoliageQuality@1]
foliage.MinimumScreenSize=0.01
foliage.LODDistanceScale=0.5
r.FoliageShadows=0

[ShadingQuality@0]
r.LightMaxDrawDistanceScale=0.5
r.VolumetricFog=0

[ShadingQuality@1]
r.LightMaxDrawDistanceScale=0.8
r.VolumetricFog=0
