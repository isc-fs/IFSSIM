services:

  # ROS2 bridge + full driverless pipeline in one container
  # Connects to UE5/IFSSIM running natively on the host
  dv_pipeline_stack:
    build:
      context: .
      dockerfile: docker/dv_pipeline_stack/Dockerfile
    # Pin image name so it stays `ifssim-dv_pipeline_stack` regardless
    # of which directory `docker compose` runs from. Without this,
    # compose auto-prefixes the image with the project name (the
    # directory it was invoked from), so the same image was getting
    # tagged `silly-black-47c6f4-dv_pipeline_stack` when built inside a
    # worktree and `ifssim-dv_pipeline_stack` only from the main
    # checkout. Tools (tools/replay.sh, tools/diagnostics/*) and the
    # cone_graph_slam progress doc all assume the `ifssim-` prefix, so
    # canonicalize on that.
    image: ifssim-dv_pipeline_stack:latest
    environment:
      - IFSSIM_HOST=${IFSSIM_HOST:-host.docker.internal}
      - IFSSIM_PORT=${IFSSIM_PORT:-41451}
      - MISSION_NAME=${MISSION_NAME:-trackdrive}
      - TRACK_NAME=${TRACK_NAME:-A}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - PIPELINE_ENABLED=${PIPELINE_ENABLED:-false}
      # Skip the autonomous control node — useful for SLAM-only validation
      # or when keyboard-driving for motion sanity checks.
      - DV_DISABLE_CONTROL=${DV_DISABLE_CONTROL:-false}
      # Re-run `colcon build --symlink-install` at container startup. Default
      # off — Python edits to existing files go live via --symlink-install
      # without any rebuild. Set to "true" only when you've changed setup.py,
      # added a new package, edited a .msg, or touched C++ source. See #176
      # for the bind-mount story this flag completes.
      - DV_REBUILD_ON_STARTUP=${DV_REBUILD_ON_STARTUP:-false}
      # Unified numba JIT cache dir — ensures all pipeline nodes (slam, control,
      # path_planning) share one persisted location regardless of where their
      # source happens to live. Previous per-module __pycache__ volumes missed
      # fsd_path_planning's deeply-nested caches, which left Plan_Path to
      # re-JIT on every container boot and get SIGKILL'd mid-compile when the
      # pipeline was restarted.
      - NUMBA_CACHE_DIR=/numba_cache
      # Fast DDS transport: SHM + UDP fallback (the default). SHM is
      # ~order-of-magnitude cheaper than UDP for same-container pub/sub
      # and is the dominant cost on the bridge's 400 Hz sensor publish
      # thread under pipeline load (sensor topics dropped from ~95 % of
      # nominal idle → ~55 % of nominal with the full pipeline running,
      # not because of subscriber backpressure but because per-publish
      # DDS UDP serialisation + send was wall-clock-bound).
      #
      # Previously forced to UDPv4 because Docker's default /dev/shm
      # (64 MB) caused "RTPS_TRANSPORT_SHM Error: Failed init_port"
      # stalls. shm_size below is now 1 GB (see below), so SHM has
      # plenty of room and the original failure mode no longer applies.
      # Let Fast DDS pick its default (SHM-preferred, UDP fallback for
      # any host-external traffic — UE5 plugin still uses raw TCP/UDP
      # on its own sockets).
    ports:
      # UE5 pushes sensor data to these ports — must be mapped so host→container works
      - "127.0.0.1:41452:41452/udp"
      - "127.0.0.1:41453:41453/udp"
      # Foxglove WebSocket bridge — connect Lichtblick at ws://localhost:8765
      - "127.0.0.1:8765:8765"
    extra_hosts:
      # Resolves host.docker.internal on Linux (noop on Mac/Windows where it's built-in)
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Numba JIT cache so ~20 s warmup only happens on first ever run.
      # Redirected here via NUMBA_CACHE_DIR above so slam, control, and
      # path_planning (including the vendored fsd_path_planning) all share it.
      - numba_cache:/numba_cache
      # Shared pipeline control flag — backend writes here to start/stop the pipeline
      - pipeline_ctrl:/pipeline_ctrl
      # Bind-mount each ROS package over the image's COPY'd baseline so host
      # source is the source of truth at runtime. Image-time `colcon build
      # --symlink-install` produced an install/ tree whose Python entries are
      # symlinks back to /dv_pipeline_stack_ws/src/<pkg>/...; with these
      # bind-mounts those symlinks now resolve to live host code. Edit a
      # Python file, restart the pipeline (toggle the pipeline_ctrl flag),
      # and the change is in effect — no `docker cp`, no image rebuild.
      #
      # Caveats (set DV_REBUILD_ON_STARTUP=true or run colcon build via
      # `docker compose exec dv_pipeline_stack` for these):
      #   - C++ source changes (ifssim_bridge): need recompile.
      #   - .msg file changes (fs_msgs): need regeneration.
      #   - setup.py changes (new entry_points, new packages): need re-link.
      #
      # Mounted per-package, not as a single tree, because ros2/src/ and
      # pipeline/ collapse into one src/ inside the container — a single
      # bind-mount of either parent would hide the other.
      - ./pipeline/cone_slam:/dv_pipeline_stack_ws/src/cone_slam
      - ./pipeline/control:/dv_pipeline_stack_ws/src/control
      - ./pipeline/path_planning:/dv_pipeline_stack_ws/src/path_planning
      - ./pipeline/slam:/dv_pipeline_stack_ws/src/slam
      - ./ros2/src/fs_msgs:/dv_pipeline_stack_ws/src/fs_msgs
      - ./ros2/src/ifssim_bridge:/dv_pipeline_stack_ws/src/ifssim_bridge
    mem_limit: 1500m      # bridge+foxglove+rosboard: ~300 MB idle, ~1.5 GB with pipeline
    memswap_limit: 1500m  # disable swap — OOM-kill instead of thrashing
    shm_size: 1gb         # Default 64 MB is too small for Fast DDS SHM —
                          # 1 GB lets DDS use its native shared-memory
                          # transport which is dramatically cheaper than
                          # UDP for same-container pub/sub.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ifssim_bridge"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Mission Control backend — FastAPI telemetry + event management
  mission_control_backend:
    build:
      context: .
      dockerfile: docker/mission_control_backend/Dockerfile
    environment:
      - IFSSIM_HOST=${IFSSIM_HOST:-host.docker.internal}
      - IFSSIM_PORT=${IFSSIM_PORT:-41451}
      # Container-internal path for reading/writing track files
      - TRACKS_DIR=/tracks
      # Host-side path sent to UE5 via RPC (UE5 runs on host, needs the real absolute path)
      - UE5_TRACKS_DIR=${PWD}/Content/tracks
      # Random track generator (MITMotorsports/random-track-generator, git submodule at tools/random-track-generator)
      - TRACK_GEN_PATH=/track_gen
      # Auth. If IFSSIM_MC_API_KEY is unset/empty the backend runs
      # unauthenticated (dev default). Set via .env or the shell env
      # before `docker compose up` to require X-API-Key on mutating
      # endpoints and the telemetry WebSocket.
      - IFSSIM_MC_API_KEY=${IFSSIM_MC_API_KEY:-}
      - IFSSIM_MC_CORS_ORIGINS=${IFSSIM_MC_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./Content/tracks:/tracks
      - pipeline_ctrl:/pipeline_ctrl
      - ./tools/random-track-generator:/track_gen:ro
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/sim/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Lichtblick — web-based ROS 2 visualizer, connects to Foxglove bridge at ws://localhost:8765
  lichtblick:
    image: ghcr.io/lichtblick-suite/lichtblick:latest
    platform: linux/amd64   # no arm64 image published; runs via Rosetta on Apple Silicon
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Mission Control frontend — React/Tailwind dashboard
  mission_control_frontend:
    build:
      context: .
      dockerfile: docker/mission_control_frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - mission_control_backend
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped


volumes:
  numba_cache:
  pipeline_ctrl:
