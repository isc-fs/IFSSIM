server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy → backend.
    # Backend now runs with `network_mode: host` (so its rclpy node
    # can join the DDS domain dv_pipeline_stack lives on), which
    # means the compose-network DNS name `mission_control_backend`
    # no longer resolves from the frontend container. Talk to it via
    # the host gateway instead — `extra_hosts` in docker-compose.yml
    # makes host.docker.internal resolvable from this nginx process.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Stop-and-save (POST /api/event/start teardown / bag stop) streams a
        # multi-GB bag out of dv_pipeline_stack and derives the car-parity copy
        # — that can take minutes. Without an explicit timeout nginx falls back
        # to its 60 s default and returns 504 while the backend is still (and
        # successfully) finishing, so the bag lands on disk but the UI shows an
        # error. Give /api the same headroom the /ws block already has.
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;
    }

    # WebSocket proxy → backend (same upstream, see /api/ comment).
    location /ws {
        proxy_pass http://host.docker.internal:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
