# Roadmap P2a reproduction (docs/ENVIRONMENT_ROADMAP.md): autocross with 0.6 m tyre walls 0.5-0.6 m behind the cone line.
# 5 environment seeds (clutter_tyrewall_e1..e5, tools/envgen/clutter.py) x 5 runs each (scenario seeds 0-4)
# = 25 runs. The props load without Environment.Enabled (a clutter_* sidecar), so no settings change.
# Compare with clutter-control: python3 tools/sim_benchmark/clutter_report.py
#   python3 tools/sim_benchmark/run_spec.py clutter-tyrewall
schema: 1
name: clutter, tyrewall
notes: P2a reproduction. Outcome stopped_early = the pipeline declared the mission finished before the finish line.
benchmarks:
  missions:
    repeats: 1
    settings:
      missions: autocross
      repeats: 5          # per track, repeat i resets with scenario seed i
      tracks: clutter_tyrewall_e1.csv,clutter_tyrewall_e2.csv,clutter_tyrewall_e3.csv,clutter_tyrewall_e4.csv,clutter_tyrewall_e5.csv
