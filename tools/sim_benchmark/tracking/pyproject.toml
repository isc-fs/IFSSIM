[project]
name = "bench-tracking"
version = "0.1.0"
description = "Benchmark tracking for IFSSIM sim_benchmark: runs into MLflow, and the bench-view viewer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "plotly>=5.20", "pyyaml>=6"]

[project.optional-dependencies]
mlflow = ["mlflow>=2.18"]
# the job queue and worker (Postgres on the central machine, SQLite elsewhere)
launch = ["sqlalchemy>=2", "psycopg[binary]>=3.2,<4"]
viewer = ["bench-tracking[mlflow,launch]", "dash>=3.0", "dash-ag-grid>=31", "pyarrow>=15"]
all = ["bench-tracking[mlflow,launch,viewer]"]
dev = ["pytest>=8"]

[project.scripts]
bench-track = "bench_tracking.cli:main"
bench-view = "bench_tracking.viewer.app:main"
bench-run = "bench_tracking.launch.run:main"
bench-worker = "bench_tracking.launch.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_tracking"]
